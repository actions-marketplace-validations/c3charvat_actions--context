name: ~ Example Reusable
on:
  workflow_call:
    inputs:
      workflow-context:
        type: string

jobs:
  job-within-a-reusable-workflow:
    runs-on: ubuntu-latest
    steps:
      - run: env | grep GITHUB_

      - uses: actions/checkout@v5.0.1

      - uses: ./
        with:
          workflow-context: ${{ inputs.workflow-context }}
